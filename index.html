<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b1a">
  <link rel="manifest" href="manifest.json">

  <title>SATYAM Presents - GK Quiz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(79,70,229,.35), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(124,58,237,.35), transparent 30%),
        linear-gradient(135deg, #050816, #0b1026, #120b2d);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
      pointer-events: none;
      animation: float 6s ease-in-out infinite alternate;
    }

    body::before {
      background: #4f46e5;
      top: -70px;
      left: -70px;
    }

    body::after {
      background: #a855f7;
      right: -70px;
      bottom: -70px;
      animation-delay: 2s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(35px, -25px);
      }
    }

    .app {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .screen {
      background: rgba(15, 20, 45, .82);
      border: 1px solid rgba(139, 92, 246, .35);
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 35px rgba(79,70,229,.12);
      backdrop-filter: blur(18px);
    }

    /* HOME */

    .logo {
      width: 105px;
      height: 105px;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
      border-radius: 25px;
      box-shadow:
        0 0 20px rgba(99,102,241,.55),
        0 0 45px rgba(124,58,237,.25);
    }

    .creator {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow:
        0 0 8px #6366f1,
        0 0 20px rgba(99,102,241,.7);
    }

    .presents {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-top: 5px;
      margin-bottom: 7px;
      letter-spacing: 2px;
    }

    .title {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #aeb6cc;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .feature {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(139,92,246,.22);
      border-radius: 17px;
      padding: 16px 10px;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
    }

    .feature strong {
      display: block;
      font-size: 25px;
      margin-bottom: 7px;
    }

    button {
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn,
    .next-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      color: white;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      box-shadow:
        0 8px 25px rgba(79,70,229,.35),
        0 0 18px rgba(124,58,237,.2);
      transition: .2s;
    }

    .start-btn:hover,
    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 30px rgba(79,70,229,.45),
        0 0 25px rgba(124,58,237,.3);
    }

    .start-btn:active,
    .next-btn:active {
      transform: scale(.98);
    }

    #quiz-screen {
      display: none;
    }

    /* QUIZ */

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: bold;
    }

    #score {
      color: #a78bfa;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,.08);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 27px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      box-shadow: 0 0 12px rgba(139,92,246,.8);
      transition: width .35s ease;
    }

    .question {
      font-size: 23px;
      line-height: 1.45;
      color: #f8fafc;
      margin-bottom: 22px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option {
      width: 100%;
      text-align: left;
      padding: 16px;
      border: 1px solid rgba(148,163,184,.22);
      border-radius: 15px;
      background: rgba(255,255,255,.045);
      color: #e2e8f0;
      font-size: 16px;
      transition: .2s;
    }

    .option:hover {
      border-color: #6366f1;
      background: rgba(99,102,241,.12);
      transform: translateX(3px);
    }

    .option.correct {
      background: rgba(34,197,94,.16);
      border-color: #22c55e;
      color: #86efac;
      box-shadow: 0 0 15px rgba(34,197,94,.12);
    }

    .option.wrong {
      background: rgba(239,68,68,.16);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .option:disabled {
      cursor: not-allowed;
    }

    .next-btn {
      display: none;
    }

    /* RESULT */

    .score-box {
      text-align: center;
      padding: 15px 0;
    }

    .trophy {
      font-size: 70px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 15px rgba(250,204,21,.35));
    }

    .score-box h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .score-number {
      font-size: 58px;
      font-weight: 900;
      margin: 10px 0 22px;
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .result-message {
      color: #aeb6cc;
      margin-bottom: 22px;
    }

    @media (max-width: 400px) {
      .screen {
        padding: 24px 16px;
      }

      .creator {
        font-size: 27px;
      }

      .title {
        font-size: 29px;
      }

      .question {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HOME SCREEN -->

    <div class="screen" id="home-screen">

      <img
        src="icons/icon-192.png"
        alt="GK Quiz Logo"
        class="logo"
      >

      <div class="creator">
        SATYAM SHUKLA

        @VIP_DR_DON
      </div>

      <div class="presents">
        PRESENTS
      </div>

      <h1 class="title">
        🧠 GK Quiz
      </h1>

      <p class="subtitle">
        Challenge your brain, test your knowledge,
        and become a GK champion! 🏆
      </p>

      <div class="features">

        <div class="feature">
          <strong>🧠</strong>
          GK Questions
        </div>

        <div class="feature">
          <strong>🏆</strong>
          Score Points
        </div>

        <div class="feature">
          <strong>⚡</strong>
          Quick Quiz
        </div>

        <div class="feature">
          <strong>📚</strong>
          Learn More
        </div>

      </div>

      <button
        class="start-btn"
        onclick="startQuiz()">
        Start Quiz 🚀
      </button>

    </div>


    <!-- QUIZ SCREEN -->

    <div class="screen" id="quiz-screen">

      <div class="quiz-top">

        <span id="question-number">
          Question 1/5
        </span>

        <span id="score">
          Score: 0
        </span>

      </div>

      <div class="progress-container">

        <div
          class="progress-bar"
          id="progress-bar">
        </div>

      </div>

      <h2
        class="question"
        id="question">
        Question will appear here
      </h2>

      <div
        class="options"
        id="options">
      </div>

      <button
        class="next-btn"
        id="next-btn"
        onclick="nextQuestion()">
        Next →
      </button>

    </div>

  </div>


  <script>

    const questions = [

      {
        question: "What is the capital of India?",
        options: [
          "Mumbai",
          "New Delhi",
          "Kolkata",
          "Chennai"
        ],
        answer: 1
      },

      {
        question: "Which planet is known as the Red Planet?",
        options: [
          "Venus",
          "Mars",
          "Jupiter",
          "Mercury"
        ],
        answer: 1
      },

      {
        question: "Which is the largest ocean on Earth?",
        options: [
          "Atlantic Ocean",
          "Indian Ocean",
          "Arctic Ocean",
          "Pacific Ocean"
        ],
        answer: 3
      },

      {
        question: "What is the chemical symbol for gold?",
        options: [
          "Ag",
          "Au",
          "Gd",
          "Go"
        ],
        answer: 1
      },

      {
        question: "How many continents are there?",
        options: [
          "5",
          "6",
          "7",
          "8"
        ],
        answer: 2
      }

    ];


    let currentQuestion = 0;
    let userScore = 0;
    let answered = false;


    function startQuiz() {

      currentQuestion = 0;
      userScore = 0;

      document.getElementById("home-screen").style.display =
        "none";

      document.getElementById("quiz-screen").style.display =
        "block";

      loadQuestion();
    }


    function loadQuestion() {

      answered = false;

      const questionData =
        questions[currentQuestion];

      document.getElementById("question-number").textContent =
        `Question ${currentQuestion + 1}/${questions.length}`;

      document.getElementById("score").textContent =
        `Score: ${userScore}`;

      document.getElementById("question").textContent =
        questionData.question;

      const progress =
        ((currentQuestion + 1) / questions.length) * 100;

      document.getElementById("progress-bar").style.width =
        progress + "%";

      const optionsContainer =
        document.getElementById("options");

      optionsContainer.innerHTML = "";

      questionData.options.forEach((option, index) => {

        const button =
          document.createElement("button");

        button.className = "option";
        button.textContent = option;

        button.onclick =
          () => selectAnswer(index, button);

        optionsContainer.appendChild(button);

      });

      document.getElementById("next-btn").style.display =
        "none";
    }


    function selectAnswer(index, button) {

      if (answered) return;

      answered = true;

      const correctAnswer =
        questions[currentQuestion].answer;

      const allOptions =
        document.querySelectorAll(".option");

      allOptions.forEach((option, i) => {

        option.disabled = true;

        if (i === correctAnswer) {
          option.classList.add("correct");
        }

      });

      if (index === correctAnswer) {

        userScore++;
        button.classList.add("correct");

      } else {

        button.classList.add("wrong");

      }

      document.getElementById("score").textContent =
        `Score: ${userScore}`;

      document.getElementById("next-btn").style.display =
        "block";
    }


    function nextQuestion() {

      currentQuestion++;

      if (currentQuestion < questions.length) {

        loadQuestion();

      } else {

        showResult();

      }
    }


    function showResult() {

      let message = "";

      if (userScore === questions.length) {
        message = "Perfect score! 🔥 You're a GK master!";
      } else if (userScore >= 3) {
        message = "Great job! 🏆 Keep learning!";
      } else {
        message = "Good try! 📚 Keep practicing!";
      }

      document.getElementById("quiz-screen").innerHTML = `

        <div class="score-box">

          <div class="trophy">
            🏆
          </div>

          <h1>
            Quiz Complete!
          </h1>

          <p class="result-message">
            ${message}
          </p>

          <div class="score-number">
            ${userScore}/${questions.length}
          </div>

          <button
            class="start-btn"
            onclick="location.reload()">
            Play Again 🔄
          </button>

        </div>

      `;
    }


    /* SERVICE WORKER */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker.register("./sw.js")

          .then(() => {
            console.log("Service Worker registered");
          })

          .catch((error) => {
            console.log("Service Worker error:", error);
          });

      });

    }

  </script>

</body>
</html>
